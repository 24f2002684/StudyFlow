<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon_v1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUDICHU — Minimalist & Fun Student To-Do App</title>
    <meta name="description" content="MUDICHU is a colorful, minimalist to-do and productivity app designed specifically for college students with integrated Pomodoro timer, task grouping, and focus tracking." />
    
    <!-- Instant Theme Setter (No Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('studyflow_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;600&display=swap" rel="stylesheet">
  </head>
